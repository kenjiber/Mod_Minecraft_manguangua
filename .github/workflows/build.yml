name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show project structure
        run: |
          echo "Contenido del repositorio:"
          find . -maxdepth 3 -type f | sort

      - name: Build with Gradle
        run: |
          if [ -f "settings.gradle" ]; then
            gradle clean build
          elif [ -f "settings.gradle.kts" ]; then
            gradle clean build
          elif [ -f "TheStalker/settings.gradle" ]; then
            cd TheStalker
            gradle clean build
          else
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi
