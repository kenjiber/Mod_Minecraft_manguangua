name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No hace falta un gradlew en el repo: esta accion instala y cachea
      # Gradle por ti. Si mas adelante generas el wrapper (gradlew/gradlew.bat
      # + gradle/wrapper/gradle-wrapper.jar), la propia accion lo detecta y
      # lo usa automaticamente en vez de la version fijada abajo.
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      # El proyecto (build.gradle/settings.gradle) puede estar en la raiz
      # del repo o dentro de una subcarpeta (por ejemplo si al subir el
      # zip quedo todo dentro de "thestalker/"). Este paso lo busca solo,
      # asi el workflow funciona sea cual sea tu estructura de carpetas.
      - name: Detectar carpeta del proyecto Gradle
        id: locate
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Proyecto encontrado en la raiz del repo."
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
            if [ -z "$FOUND" ]; then
              echo "::error::No se encontro ningun settings.gradle en el repo (hasta 4 niveles de profundidad)."
              echo "Contenido del repo para depurar:"
              find . -maxdepth 3 -not -path '*/.git/*'
              exit 1
            fi
            DIR=$(dirname "$FOUND")
            echo "Proyecto encontrado en: $DIR"
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar con Gradle
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle build --stacktrace

      - name: Subir el .jar del mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thestalker-jar
          path: '**/build/libs/*.jar'
          if-no-files-found: warn

      # Si el build falla, esto te deja descargar los reportes de Gradle
      # (incluye la traza completa de los errores de compilacion) sin
      # tener que hacer capturas de pantalla del resumen.
      - name: Subir reportes de build (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '**/build/reports'
          if-no-files-found: ignore
          
